name: fdl-app

replicaCount: 2

image:
  repository: asoltes/file-download-stream
  tag: v3.3.0
  pullPolicy: Always

namespace: file-download-app
awsSecretName: aws-credentials

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

ingress:
  enabled: true
  className: traefik
  host: dltest.andrestrek.com
  entrypoints: web
  middlewares: fdl-app-forward-auth@kubernetescrd
  path: /
  pathType: Prefix

service:
  port: 80
  targetPort: 80

middleware:
  forwardAuth:
    address: https://httpbin.org/basic-auth/user/passwd
